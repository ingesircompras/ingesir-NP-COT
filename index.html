<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Pedidos - INGESIR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .header-bg { background-color: #1b365d; color: white; border-bottom: 4px solid #4A6C8C; }
        .card { border-radius: 8px; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .section-title { font-weight: bold; color: #1b365d; border-left: 4px solid #4A6C8C; padding-left: 10px; text-transform: uppercase; letter-spacing: 0.5px;}
        .btn-principal { background-color: #1b365d; color: white; border: none; }
        .btn-principal:hover { background-color: #142845; color: white; }
    </style>
</head>
<body>

    <div class="header-bg p-4 mb-4">
        <div class="container d-flex align-items-center">
            <div class="bg-white p-2 rounded me-4 shadow-sm d-flex align-items-center justify-content-center" style="width: 140px; height: 70px;">
                <img src="LOGO.png" alt="INGESIR Logo" style="max-height: 100%; max-width: 100%;">
            </div>
            <div>
                <small class="text-uppercase" style="letter-spacing: 1px; color: #cbd5e1;">INGESIR ENVASADORAS S.R.L.</small>
                <h3 class="mb-0 fw-bold">Generador de Documentos</h3>
            </div>
        </div>
    </div>

    <div class="container" style="max-width: 800px;">
        
        <!-- Datos del Documento -->
        <div class="card p-4 mb-4">
            <h6 class="section-title mb-4">Datos del Documento</h6>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label text-muted small fw-bold">Proveedor</label>
                    <input type="text" class="form-control bg-light" id="inputProveedor" placeholder="Nombre del proveedor...">
                </div>
                <div class="col-md-4">
                    <label class="form-label text-muted small fw-bold">Tipo de Documento</label>
                    <select class="form-select bg-light" id="selectTipo">
                        <option value="NOTA DE PEDIDO">Nota de Pedido</option>
                        <option value="COTIZACION">Cotización</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label text-muted small fw-bold">Nro. de Referencia</label>
                    <input type="text" class="form-control bg-light" id="inputRef" placeholder="Ej: 954725">
                </div>
            </div>
        </div>

        <!-- Carga de Ítems -->
        <div class="card p-4 mb-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h6 class="section-title mb-0">Artículos Solicitados</h6>
                <button class="btn btn-sm btn-outline-secondary fw-bold" onclick="abrirHistorial()">📜 Ver historial</button>
            </div>
            
            <div class="row g-2 mb-3 align-items-end p-3 bg-light rounded border">
                <div class="col-sm-7">
                    <label class="form-label text-muted small mb-1">Descripción</label>
                    <input type="text" class="form-control" id="inputDesc" placeholder="Ej: Bulón M8x35">
                </div>
                <div class="col-sm-3">
                    <label class="form-label text-muted small mb-1">Cantidad</label>
                    <input type="text" class="form-control" id="inputCant" placeholder="Ej: 10 un">
                </div>
                <div class="col-sm-2">
                    <button class="btn btn-principal w-100 fw-bold" onclick="leerInputYAgregar()">Agregar</button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover mt-3 align-middle" id="tablaItems">
                    <thead class="table-light">
                        <tr>
                            <th class="text-secondary small" style="width: 70px;">Ítem</th>
                            <th class="text-secondary small">Descripción del Artículo</th>
                            <th class="text-secondary small" style="width: 120px;">Cant.</th>
                            <th style="width: 80px;"></th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla"></tbody>
                </table>
            </div>
        </div>

        <div class="text-end mb-5">
            <button class="btn btn-success px-5 py-3 fw-bold shadow-sm" style="border-radius: 8px; font-size: 1.1rem;" onclick="generarYGuardarPDF()">📄 GENERAR Y GUARDAR EN DRIVE</button>
        </div>
    </div>

    <!-- Modal Historial -->
    <div class="modal fade" id="modalHistorial" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold text-dark">Últimos documentos generados</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0">
                    <div class="list-group list-group-flush" id="listaHistorial"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let contadorItems = 1;

        function leerInputYAgregar() {
            const desc = document.getElementById('inputDesc').value;
            const cant = document.getElementById('inputCant').value;
            if (desc === '') { alert('Falta ingresar la descripción.'); return; }
            agregarFila(desc, cant);
            document.getElementById('inputDesc').value = '';
            document.getElementById('inputCant').value = '';
            document.getElementById('inputDesc').focus();
        }

        function agregarFila(descripcion, cantidad) {
            const tbody = document.getElementById('cuerpoTabla');
            const fila = document.createElement('tr');
            fila.innerHTML = `
                <td class="num-item fw-bold text-secondary">${contadorItems++}</td>
                <td class="desc-item fw-medium text-dark">${descripcion}</td>
                <td><input type="text" class="form-control form-control-sm cant-item text-center fw-bold text-primary" value="${cantidad}"></td>
                <td class="text-end"><button class="btn btn-sm btn-outline-danger border-0" onclick="this.parentElement.parentElement.remove()">✕</button></td>
            `;
            tbody.appendChild(fila);
        }

        function guardarEnHistorial(proveedor, tipoDoc, ref, items) {
            let historial = JSON.parse(localStorage.getItem('ingesir_historial')) || [];
            let nuevoRegistro = {
                fecha: new Date().toLocaleDateString('es-AR') + ' ' + new Date().toLocaleTimeString('es-AR', {hour: '2-digit', minute:'2-digit'}),
                proveedor: proveedor, tipoDoc: tipoDoc, ref: ref, items: items
            };
            historial.unshift(nuevoRegistro);
            if (historial.length > 10) historial.pop();
            localStorage.setItem('ingesir_historial', JSON.stringify(historial));
        }

        function abrirHistorial() {
            let historial = JSON.parse(localStorage.getItem('ingesir_historial')) || [];
            let contenedor = document.getElementById('listaHistorial');
            contenedor.innerHTML = '';
            if (historial.length === 0) {
                contenedor.innerHTML = '<div class="p-4 text-center text-muted">No hay documentos guardados.</div>';
            } else {
                historial.forEach((reg, index) => {
                    let btn = document.createElement('button');
                    btn.className = 'list-group-item list-group-item-action p-3';
                    btn.innerHTML = `<div class="d-flex w-100 justify-content-between"><h6 class="mb-0 fw-bold">${reg.proveedor} (REF: ${reg.ref})</h6><small>${reg.fecha}</small></div><small>${reg.tipoDoc} - ${reg.items.length} ítems</small>`;
                    btn.onclick = () => cargarDesdeHistorial(index);
                    contenedor.appendChild(btn);
                });
            }
            new bootstrap.Modal(document.getElementById('modalHistorial')).show();
        }

        function cargarDesdeHistorial(index) {
            let historial = JSON.parse(localStorage.getItem('ingesir_historial')) || [];
            let reg = historial[index];
            document.getElementById('inputProveedor').value = reg.proveedor;
            document.getElementById('selectTipo').value = reg.tipoDoc;
            document.getElementById('inputRef').value = reg.ref;
            document.getElementById('cuerpoTabla').innerHTML = '';
            contadorItems = 1;
            reg.items.forEach(item => agregarFila(item.desc, item.cant));
            bootstrap.Modal.getInstance(document.getElementById('modalHistorial')).hide();
        }

        function generarYGuardarPDF() {
            const proveedor = document.getElementById('inputProveedor').value;
            const tipoDoc = document.getElementById('selectTipo').value;
            const refNum = document.getElementById('inputRef').value.trim();

            if (proveedor === '') {
                alert('Por favor, ingresa el nombre del proveedor.');
                document.getElementById('inputProveedor').focus();
                return;
            }

            if (refNum === '') {
                alert('Por favor, ingresa el número de referencia.');
                document.getElementById('inputRef').focus();
                return;
            }

            const filas = document.querySelectorAll('#cuerpoTabla tr');
            let items = [];

            filas.forEach(fila => {
                items.push({
                    desc: fila.querySelector('.desc-item').innerText,
                    cant: fila.querySelector('.cant-item').value
                });
            });

            if (items.length === 0) {
                alert('Falta agregar artículos al documento.');
                return;
            }

            // Guardamos en el historial con su tipo y referencia exacta
            guardarEnHistorial(proveedor, tipoDoc, refNum, items);

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Encabezado corporativo azul
            doc.setFillColor(27, 54, 93);
            doc.rect(0, 0, 210, 35, 'F');
            
            doc.setTextColor(255, 255, 255);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(18);
            doc.text("INGESIR ENVASADORAS S.R.L.", 14, 15);
            
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.text("Av. Francia Nº 1771 - Rosario | CUIT: 30-70147850-5", 14, 22);
            doc.text("Tel: 341-2502327 | compras@ingesir.com.ar", 14, 28);

            // Título
            doc.setTextColor(27, 54, 93);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(16);
            doc.text(tipoDoc, 14, 48);

            // Datos generales
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(50, 50, 50);
            const fechaActual = new Date().toLocaleDateString('es-AR');
            
            doc.text(`Número REF: ${refNum}`, 14, 56);
            doc.text(`Fecha: ${fechaActual}`, 130, 56);
            doc.text(`Proveedor: ${proveedor}`, 14, 63);

            doc.setDrawColor(200, 200, 200);
            doc.line(14, 68, 196, 68);

            // Tabla Cabecera
            doc.setFillColor(74, 108, 140);
            doc.rect(14, 73, 182, 8, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFont("helvetica", "bold");
            doc.text("ÍTEM", 18, 79);
            doc.text("DESCRIPCIÓN DEL ARTÍCULO", 40, 79);
            doc.text("CANTIDAD", 160, 79);

            let y = 87;
            doc.setFont("helvetica", "normal");
            doc.setTextColor(40, 40, 40);

            items.forEach((item, index) => {
                if (y > 270) {
                    doc.addPage();
                    y = 25;
                }
                if (index % 2 === 0) {
                    doc.setFillColor(248, 249, 250);
                    doc.rect(14, y - 5, 182, 8, 'F');
                }
                doc.text((index + 1).toString(), 18, y);
                doc.text(item.desc, 40, y);
                doc.text(item.cant, 160, y);
                y += 8;
            });

            // Pie de página y Firma institucional por hoja
            const totalPaginas = doc.internal.getNumberOfPages();
            for (let i = 1; i <= totalPaginas; i++) {
                doc.setPage(i);
                doc.setDrawColor(150, 150, 150);
                doc.line(130, 265, 190, 265);
                doc.setFont("helvetica", "bold");
                doc.setFontSize(10);
                doc.text("Tec. Yamir Aracne", 130, 271);
                doc.setFont("helvetica", "normal");
                doc.setFontSize(9);
                doc.setTextColor(100, 100, 100);
                doc.text("Encargado de Compras", 130, 276);
                doc.text(`Página ${i} de ${totalPaginas}`, 14, 276);
            }

            const nombreArchivo = `${tipoDoc}_${refNum}_${proveedor}.pdf`;

            // Descarga local
            doc.save(nombreArchivo);

            // Subida a Drive en segundo plano
            const pdfBase64 = doc.output('datauristring').split(',')[1];
            const btn = document.querySelector('.btn-success');
            btn.innerHTML = "⏳ GUARDANDO EN DRIVE...";
            btn.disabled = true;

            const urlGoogle = 'TU_URL_DE_APPS_SCRIPT_AQUI'; // Recordá poner tu URL de Apps Script aquí

            fetch(urlGoogle, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ file: pdfBase64, filename: nombreArchivo })
            })
            .then(res => res.json())
            .then(res => {
                alert("✅ ¡Éxito!\n\nEl PDF se generó, se descargó y se guardó en tu Google Drive.");
                btn.innerHTML = "📄 GENERAR Y GUARDAR EN DRIVE";
                btn.disabled = false;
                
                // Limpieza total de la pantalla para el próximo pedido
                document.getElementById('inputProveedor').value = '';
                document.getElementById('inputRef').value = '';
                document.getElementById('cuerpoTabla').innerHTML = '';
                contadorItems = 1;
                document.getElementById('inputDesc').value = '';
                document.getElementById('inputCant').value = '';
                document.getElementById('inputProveedor').focus();
            })
            .catch(err => {
                alert("⚠️ El PDF se generó y descargó localmente, pero hubo un error al subirlo a Drive.");
                btn.innerHTML = "📄 GENERAR Y GUARDAR EN DRIVE";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
